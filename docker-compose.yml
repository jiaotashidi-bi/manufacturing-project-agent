services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: manufacturing_agent
      POSTGRES_USER: manufacturing_agent
      POSTGRES_PASSWORD: local_demo_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manufacturing_agent"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    environment:
      MPA_DATABASE_URL: postgresql+psycopg://manufacturing_agent:local_demo_password@db:5432/manufacturing_agent
      MPA_AUTH_MODE: demo
      MPA_PUBLIC_DEMO_ONLY: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - exports:/app/exports

  ui:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      MPA_SERVICE_KIND: ui
      MPA_DATABASE_URL: postgresql+psycopg://manufacturing_agent:local_demo_password@db:5432/manufacturing_agent
      MPA_AUTH_MODE: demo
      MPA_PUBLIC_DEMO_ONLY: "true"
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - exports:/app/exports

volumes:
  postgres_data:
  exports:
