[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-project-agent"
version = "0.2.0"
description = "A citation-first, human-in-the-loop agent for manufacturing policy applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Portfolio Demo" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5.1,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.2,<5",
  "scikit-learn>=1.6,<2",
  "SQLAlchemy>=2.0,<3",
  "streamlit>=1.45,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "mypy>=1.14,<2",
  "pip-audit>=2.8,<3",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
manufacturing-agent-demo = "manufacturing_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["manufacturing_agent"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
